<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Blandade snabbfrågor för Programmering 1.">
    <title>Blandade snabbfrågor – Programmering 1</title>
    <link rel="stylesheet" href="snabbfragor.css">
</head>
<body>
<header class="topbar"><a href="index.html">← Välj frågeläge</a><span data-selection-title>Alla kapitel</span></header>
<main class="random-shell">
    <p class="eyebrow" data-chapter></p>
    <p data-position aria-live="polite"></p>
    <article class="random-card">
        <h1 data-random-question></h1>
        <p class="think-prompt">Tänk ut svaret först. Tryck sedan på mellanslag eller knappen för att visa facit.</p>
        <section class="random-answer" data-random-answer hidden>
            <h2>Facit</h2>
            <p data-answer-text></p>
            <pre data-code-wrap hidden><code data-answer-code></code></pre>
            <p data-explanation></p>
        </section>
        <div class="random-actions">
            <button type="button" data-show-answer>Visa facit</button>
            <button type="button" data-next-random hidden>Nästa fråga</button>
        </div>
    </article>
</main>
<script src="slumpfragor.js?v=20261007"></script>
</body>
</html>
